name: Release All Platforms

on:
  # Every push to main ships a release: the version bump is derived from the
  # Conventional Commit types since the last tag, so no manual version choice
  # is needed. The version-bump commit this workflow pushes is tagged
  # `[skip ci]` and filtered out below, and commits made with GITHUB_TOKEN do
  # not re-trigger workflows, so there is no loop.
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - ".github/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version Bump (auto, patch, minor, major)"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "patch"
          - "minor"
          - "major"
      tag_name:
        description: "Custom Release Tag (leave empty for automatic)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Create Pre-Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Serialise releases so two pushes cannot compute the same next version and
# race each other while creating the tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-version:
    name: Prepare Version & Tag
    # Skip the release commit this workflow itself pushes, and let any push
    # opt out with a "[skip ci]" in its message.
    if: ${{ !startsWith(github.event.head_commit.message || '', 'chore(release)') && !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Determine & Sync Version
        id: version
        shell: bash
        run: |
          git fetch --tags --force || true
          
          # Check triggers
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Triggered by git tag: ${{ github.ref_name }}"
            bun run scripts/auto-version.js "${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "Custom tag specified: ${{ inputs.tag_name }}"
            bun run scripts/auto-version.js "${{ inputs.tag_name }}"
          else
            echo "Auto-detecting version with bump strategy: ${{ inputs.bump || 'auto' }}"
            bun run scripts/auto-version.js --bump "${{ inputs.bump || 'auto' }}"
          fi

      - name: Commit and Push Tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          echo "Target Release Tag: $TAG (version: $VERSION)"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit version bumps if files changed
          if ! git diff --quiet package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml; then
            git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
            git commit -m "chore(release): $TAG [skip ci]" || true
            git push origin HEAD || echo "Could not push commit to branch, continuing..."
          fi
          
          # Only push git tag if it does not already exist
          if [ "${{ github.ref }}" != "refs/tags/$TAG" ]; then
            git tag -f "$TAG"
            git push origin "$TAG" --force
          fi

  build-windows:
    name: Build Windows
    needs: prepare-version
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ needs.prepare-version.outputs.tag }}
      app_version: ${{ needs.prepare-version.outputs.version }}
      upload_artifact: true
      publish_release: false
    secrets: inherit

  build-macos:
    name: Build macOS
    needs: prepare-version
    uses: ./.github/workflows/build-macos.yml
    with:
      ref: ${{ needs.prepare-version.outputs.tag }}
      app_version: ${{ needs.prepare-version.outputs.version }}
      upload_artifact: true
      publish_release: false
    secrets: inherit

  build-linux:
    name: Build Linux
    needs: prepare-version
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ needs.prepare-version.outputs.tag }}
      app_version: ${{ needs.prepare-version.outputs.version }}
      upload_artifact: true
      publish_release: false
    secrets: inherit

  build-android:
    name: Build Android
    needs: prepare-version
    uses: ./.github/workflows/build-android.yml
    with:
      ref: ${{ needs.prepare-version.outputs.tag }}
      app_version: ${{ needs.prepare-version.outputs.version }}
      upload_artifact: true
      publish_release: false
    secrets: inherit

  build-ios:
    name: Build iOS
    needs: prepare-version
    uses: ./.github/workflows/build-ios.yml
    with:
      ref: ${{ needs.prepare-version.outputs.tag }}
      app_version: ${{ needs.prepare-version.outputs.version }}
      upload_artifact: true
      publish_release: false
    secrets: inherit

  publish-release:
    name: Publish Release
    needs: [prepare-version, build-windows, build-macos, build-linux, build-android, build-ios]
    if: always() && !cancelled() && needs.prepare-version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Display downloaded files
        shell: bash
        run: find artifacts -type f | sort

      # upload-artifact keeps the directory layout relative to the glob's
      # non-magic prefix, so the downloaded tree looks like
      # `artifacts/msi/*.msi`, `artifacts/deb/*.deb`,
      # `artifacts/aarch64-apple-darwin/release/bundle/dmg/*.dmg`, ... .
      # Flatten every installer into one directory so the release step can
      # attach them with a simple `release-assets/*` glob.
      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s globstar nullglob
          for f in artifacts/**/*.{msi,exe,dmg,deb,AppImage,apk,aab,ipa,tar.gz}; do
            if [ -f "$f" ]; then
              cp -v "$f" release-assets/
            fi
          done

          count=$(find release-assets -maxdepth 1 -type f | wc -l)
          echo "Collected $count release asset(s)"
          ls -la release-assets

          if [ "$count" -eq 0 ]; then
            echo "::error::No installer files were found in the downloaded artifacts"
            exit 1
          fi

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag }}
          name: Release ${{ needs.prepare-version.outputs.tag }}
          prerelease: ${{ inputs.prerelease || false }}
          make_latest: ${{ (inputs.prerelease || false) && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

      # Always print exactly where the release and its assets went.
      - name: Release summary
        shell: bash
        run: |
          assets=$(find release-assets -maxdepth 1 -type f | wc -l)
          {
            echo "### Release ${{ needs.prepare-version.outputs.tag }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ needs.prepare-version.outputs.version }}\` |"
            echo "| Assets uploaded | ${assets} |"
            echo "| Release page | ${{ steps.release.outputs.url }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo ""
            echo "<details><summary>Attached files</summary>"
            echo ""
            echo '```'
            ls -1 release-assets
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
