name: Build Android

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Version to build (optional, auto-detected if empty)"
        required: false
        type: string
        default: ""
      publish_release:
        description: "Publish directly to GitHub Release"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: "Git ref or tag to checkout"
        required: false
        type: string
        default: ""
      app_version:
        description: "Version to build"
        required: false
        type: string
        default: ""
      upload_artifact:
        description: "Upload build artifact"
        required: false
        type: boolean
        default: true
      publish_release:
        description: "Publish directly to GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK & NDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_PATH=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
            echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
            echo "Found Android NDK: $NDK_PATH"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install libclang for QuickJS bindings
        shell: bash
        run: |
          if [ -z "${ANDROID_NDK_ROOT:-}" ]; then
            echo "ANDROID_NDK_ROOT is not set; cannot point bindgen at the NDK sysroot" >&2
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y libclang-dev

          # rquickjs-sys has no pre-generated bindings for Android, so bindgen
          # must parse the bundled QuickJS headers with clang. Give clang the
          # Android target triple and the NDK sysroot headers for each target
          # we may build.
          sysroot="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android24 --sysroot=$sysroot" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--target=armv7a-linux-androideabi24 --sysroot=$sysroot" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android=--target=x86_64-linux-android24 --sysroot=$sysroot" >> "$GITHUB_ENV"

          libclang_so="$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so' 2>/dev/null | head -n 1 || true)"
          if [ -n "$libclang_so" ]; then
            echo "LIBCLANG_PATH=$(dirname "$libclang_so")" >> "$GITHUB_ENV"
          fi

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Sync App Version
        id: version
        shell: bash
        run: |
          bun run scripts/auto-version.js "${{ inputs.app_version }}"

      - name: Initialize Android Target
        shell: bash
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            bun run tauri android init --ci
          fi

      - name: Build Android APK
        run: bun run tauri android build --apk --target aarch64 --ci

      # Gradle emits `app-universal-release-unsigned.apk` unless the generated
      # project has a signing config, and Android refuses to install unsigned
      # APKs ("app not installed / package appears to be invalid"). Sign the
      # release build with a keystore supplied through repo secrets instead of
      # patching the generated Gradle project on every run.
      - name: Restore Android signing key
        id: signing
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "::warning::ANDROID_KEY_BASE64 is not set — the APK stays unsigned and cannot be installed."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::ANDROID_KEY_BASE64 did not decode to a keystore file"
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"

      - name: Sign Android APK
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $build_tools"

          apk_dir="src-tauri/gen/android/app/build/outputs/apk"
          unsigned=$(find "$apk_dir" -name '*-unsigned.apk' -print -quit)
          if [ -z "$unsigned" ]; then
            unsigned=$(find "$apk_dir" -name '*.apk' -print -quit)
          fi
          if [ -z "$unsigned" ]; then
            echo "::error::The Android build produced no APK"
            exit 1
          fi

          signed="r-tube_${{ steps.version.outputs.version }}_android.apk"

          # zipalign must run before signing, never after.
          "$build_tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "${{ steps.signing.outputs.keystore }}" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "env:ANDROID_KEY_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --out "$signed" \
            "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$signed"

          # Remove the unsigned output so it can never be published by mistake.
          find "$apk_dir" -name '*.apk' -delete
          echo "Signed APK: $signed"

      # Play Store only accepts Android App Bundles, so build one as well.
      - name: Build Android AAB
        shell: bash
        run: bun run tauri android build --aab --target aarch64 --ci

      - name: Sign Android AAB
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          aab_dir="src-tauri/gen/android/app/build/outputs/bundle"
          aab=$(find "$aab_dir" -name '*.aab' -print -quit)
          if [ -z "$aab" ]; then
            echo "::error::The Android build produced no AAB"
            exit 1
          fi

          signed="r-tube_${{ steps.version.outputs.version }}_android.aab"

          jarsigner \
            -keystore "${{ steps.signing.outputs.keystore }}" \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -signedjar "$signed" \
            "$aab" \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$signed"

          find "$aab_dir" -name '*.aab' -delete
          echo "Signed AAB: $signed"

      - name: Upload Android APK & AAB
        if: ${{ inputs.upload_artifact != false }}
        uses: actions/upload-artifact@v6
        with:
          name: r-tube-android
          path: |
            r-tube_*_android.apk
            r-tube_*_android.aab
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Publish to GitHub Release
        if: ${{ inputs.publish_release != false }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            r-tube_*_android.apk
            r-tube_*_android.aab
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
