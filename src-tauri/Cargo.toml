[package]
name = "r-tube"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "r_tube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
specta = { version = "=2.0.0-rc.26", features = [
    "chrono",
    "derive",
    "function",
    "serde_json",
] }
tauri-specta = { version = "=2.0.0-rc.26", features = [
    "derive",
    "javascript",
    "typescript",
] }
specta-typescript = "0.0.13"
sea-orm = { version = "2.0.4", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
] }
# innertube-rs = { git = "https://github.com/caya8205-2/innertube-rs", branch = "main" }
innertube-rs = { git = "https://github.com/benza-1156c/innertube-rs", branch = "main" }
rtube-macros = { path = "macros" }
sea-orm-migration = { version = "2.0.4", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
url = "2"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "stream",
    "rustls",
    "http2",
] }

# `rquickjs` (pulled in transitively by innertube-rs) only ships pre-generated
# bindings for desktop targets. Enabling `bindgen` on mobile builds the bindings
# from the bundled QuickJS headers against the platform SDK instead of failing
# to include a missing `aarch64-linux-android.rs` / `aarch64-apple-ios.rs`.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rquickjs = { version = "0.14", features = ["bindgen"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
